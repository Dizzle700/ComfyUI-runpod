name: Build RunPod image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, e.g. v1.0.0 (leave blank for source SHA only)'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check startup logic
        run: |
          bash -n runpod_startup.sh comfy_install_runpod.sh docker/build.sh docker/entrypoint.sh
          python3 -m unittest discover -s tests -v
      - name: Free space for CUDA image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Image name and immutable source tag
        id: image
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$REQUESTED_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; fi
          if [[ -n "$version" && ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a version like v1.0.0'; exit 2
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: SOURCE_REVISION=${{ github.sha }}
      - name: Smoke test without GPU or model downloads
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: bash docker/smoke-test.sh "$IMAGE"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          docker push "$IMAGE"
          if [[ -n "$VERSION" ]]; then
            release_image="$IMAGE_NAME:$VERSION"
            docker tag "$IMAGE" "$release_image"
            docker push "$release_image"
            echo "RunPod Container Image: $release_image" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Image for this source revision: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'For immutable deployment, use the registry digest reported by docker push.' >> "$GITHUB_STEP_SUMMARY"
